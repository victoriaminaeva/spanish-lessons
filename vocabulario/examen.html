<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Examen — Vocabulario</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Examen de vocabulario: preguntas de opción múltiple y de respuesta escrita, corregidas todas a la vez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0eeea; --surface:#ffffff; --surface-2:#f6e4db; --ink:#1f3fc3;
  --muted:#8a855e; --accent:#c34811; --accent-ink:#f0eeea; --pop:#1f3fc3;
  --border:#e1ded5; --good:#2f7d4f; --bad:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f3fc3; --surface:#415ccc; --surface-2:#311204; --ink:#f0eeea;
    --muted:#b3b096; --accent:#d88864; --accent-ink:#1f3fc3; --pop:#6d82d8;
    --border:#3552c9; --good:#6fcf97; --bad:#f28b82;
  }
}
:root[data-theme="dark"]{
  --bg:#1f3fc3; --surface:#415ccc; --surface-2:#311204; --ink:#f0eeea;
  --muted:#b3b096; --accent:#d88864; --accent-ink:#1f3fc3; --pop:#6d82d8; --border:#3552c9;
  --good:#6fcf97; --bad:#f28b82;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans", system-ui, sans-serif; line-height:1.6;
  padding-inline:20px; padding-block:0 60px;
}
.wrap{max-width:560px; margin:0 auto;}
h1{font-family:"Fraunces", Georgia, serif; text-wrap:balance;}
a{color:var(--accent);}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  background:var(--bg); padding-block:14px 10px; margin-bottom:6px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid var(--border);
}
.topbar a.back{font-size:13px; color:var(--muted); text-decoration:none;}
.stats{font-family:"Space Mono", monospace; font-size:12.5px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap;}
.stats b{color:var(--ink);}
.tabs{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
.tab{
  flex:1; min-width:70px; text-align:center; text-decoration:none; font-family:"Space Mono", monospace;
  font-size:11.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  padding:9px 4px; border-radius:10px; border:1px solid var(--border); color:var(--muted);
}
.tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
header{padding-block:20px 8px;}
h1{font-size:clamp(24px,5vw,32px); margin:0 0 6px;}
.lead{color:var(--muted); font-size:14.5px; max-width:56ch; margin:0;}

.panel{margin-top:22px; padding:22px; border-radius:16px; background:var(--surface); border:1px solid var(--border);}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.radiogroup{display:flex; gap:10px; flex-wrap:wrap;}
.radiogroup label{
  display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink);
  background:var(--surface-2); border-radius:999px; padding:8px 14px; cursor:pointer;
}
input[type="number"]{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--ink); font-size:15px;
}
.btn-primary{
  width:100%; padding:13px; border-radius:12px; border:none; margin-top:6px;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px; cursor:pointer;
}
.btn-primary:active{transform:scale(.99);}

.score-bar{
  position:sticky; top:calc(env(safe-area-inset-top,0px) + 54px); z-index:9;
  background:var(--surface-2); border-radius:10px; padding:8px 14px; margin-top:10px;
  font-family:"Space Mono", monospace; font-size:13px; text-align:center; color:var(--ink);
}

.qblock{
  margin-top:18px; padding:20px; border-radius:14px; background:var(--surface); border:1px solid var(--border);
}
.qnum{font-family:"Space Mono", monospace; font-size:11px; color:var(--pop); font-weight:700;}
.qprompt{font-family:"Fraunces", serif; font-weight:600; font-size:18px; margin:6px 0 12px;}
.options{display:grid; gap:8px;}
.opt{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); cursor:pointer;}
.opt input{margin:0;}
.opt.correct{background:var(--good); color:#fff; border-color:var(--good);}
.opt.incorrect{background:var(--bad); color:#fff; border-color:var(--bad);}
.write-input{
  width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--ink); font-size:15px;
}
.write-input.correct{border-color:var(--good);}
.write-input.incorrect{border-color:var(--bad);}
.answer-key{font-size:13px; color:var(--muted); margin-top:6px;}

.result{
  margin-top:22px; padding:24px; border-radius:16px; background:var(--surface); border:1px solid var(--border);
  text-align:center;
}
.result .score{font-family:"Fraunces", serif; font-size:28px; font-weight:700;}

.empty{
  margin-top:40px; padding:26px 22px; border-radius:14px; background:var(--surface);
  border:1px solid var(--border); text-align:center; color:var(--muted); font-size:14.5px;
}
footer{margin-top:56px; padding-top:20px; border-top:1px solid var(--border); font-size:13px; color:var(--muted); text-align:center;}

.modules{display:flex; gap:6px; flex-wrap:wrap; margin-top:16px;}
.mod-chip{
  flex:1; min-width:78px; display:flex; flex-direction:column; align-items:center; gap:1px;
  font-family:"Public Sans", system-ui, sans-serif; font-size:13px; font-weight:600;
  padding:8px 6px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink); cursor:pointer;
}
.mod-chip small{font-family:"Space Mono", monospace; font-size:10.5px; font-weight:400; color:var(--muted);}
.mod-chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.mod-chip.active small{color:var(--accent-ink); opacity:.85;}
.mod-note{font-size:11.5px; color:var(--muted); margin:6px 0 0;}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <a class="back" href="../index.html">← Talleres</a>
  <div class="stats" id="stats"></div>
</div>

<div class="tabs">
  <a class="tab" href="index.html">Tarjetas</a>
  <a class="tab" href="aprender.html">Aprender</a>
  <a class="tab active" href="examen.html">Examen</a>
  <a class="tab" href="practica.html">Práctica</a>
</div>

<header>
  <h1>Examen</h1>
  <p class="lead">Un examen con preguntas de opción múltiple y de respuesta escrita. Corrige todo al final con «Comprobar».</p>
</header>

<div id="modulePicker"></div>
<div id="app"></div>

<footer>Vocabulario · examen</footer>
</div>

<script src="shared.js"></script>
<script>
let allCards = [];
let moduleChoice = 1;
let progress = {};
let questions = [];
let checked = false;

function renderStats(){
  const cards = scoped();
  const dueCount = cards.filter(c => isDue(c, progress)).length;
  const mastered = cards.filter(c => (progress[c.id]||{}).box === MAX_BOX).length;
  document.getElementById("stats").innerHTML =
    `<span>hoy: <b>${dueCount}</b></span><span>dominadas: <b>${mastered}</b></span><span>total: <b>${cards.length}</b></span>`;
  renderModulePicker(document.getElementById("modulePicker"), allCards, progress, moduleChoice, onModuleChange);
}

function scoped(){ return cardsForChoice(allCards, moduleChoice); }

function onModuleChange(choice){
  moduleChoice = choice;
  renderStats();
  renderSetup();
}

function renderSetup(){
  const cards = scoped();
  const dueCount = cards.filter(c => isDue(c, progress)).length;
  const scopeLabel = moduleChoice === "all" ? "Todas" : "Todo el módulo";
  document.getElementById("modulePicker").hidden = false;
  const app = document.getElementById("app");
  if(allCards.length === 0){
    app.innerHTML = `<div class="empty">Todavía no hay palabras en el vocabulario. Envía una palabra o expresión en el chat y se añadirá aquí.</div>`;
    return;
  }
  app.innerHTML = `
    <div class="panel">
      <div class="field">
        <label>¿Qué palabras entran en el examen?</label>
        <div class="radiogroup">
          <label><input type="radio" name="source" value="due" ${dueCount>0?"checked":""}> A repasar hoy (${dueCount})</label>
          <label><input type="radio" name="source" value="all" ${dueCount===0?"checked":""}> ${scopeLabel} (${cards.length})</label>
        </div>
      </div>
      <div class="field">
        <label for="count">Número de preguntas</label>
        <input type="number" id="count" min="1" max="${cards.length}" value="${Math.min(15, dueCount>0?dueCount:cards.length)}">
      </div>
      <button class="btn-primary" id="btnStart">Empezar examen</button>
    </div>
  `;
  document.getElementById("btnStart").addEventListener("click", () => {
    const source = document.querySelector('input[name="source"]:checked').value;
    const count = Math.max(1, Math.min(cards.length, parseInt(document.getElementById("count").value, 10) || 15));
    startExam(source, count);
  });
}

function startExam(source, count){
  const cards = scoped();
  const base = source === "due" ? cards.filter(c => isDue(c, progress)) : cards.slice();
  const chosen = shuffle(base.length ? base : cards).slice(0, count);
  document.getElementById("modulePicker").hidden = true;
  questions = chosen.map((c, i) => ({
    card: c,
    type: i % 2 === 0 ? "choice" : "write",
    options: i % 2 === 0 ? shuffle([c.front, ...pickDistractors(cards, c.id, 3, allCards)]) : null,
    userChoice: null,
    userText: ""
  }));
  checked = false;
  renderExam();
}

function renderExam(){
  const app = document.getElementById("app");
  const blocks = questions.map((q, i) => {
    if(q.type === "choice"){
      const opts = q.options.map(o => `
        <label class="opt" data-value="${escapeHtml(o)}">
          <input type="radio" name="q${i}" value="${escapeHtml(o)}">
          <span>${escapeHtml(o)}</span>
        </label>
      `).join("");
      return `
        <div class="qblock">
          <div class="qnum">Pregunta ${i+1} · opción múltiple</div>
          <div class="qprompt">${escapeHtml(q.card.translation)}</div>
          <div class="options" id="q${i}-options">${opts}</div>
        </div>
      `;
    }
    return `
      <div class="qblock">
        <div class="qnum">Pregunta ${i+1} · escribe la palabra</div>
        <div class="qprompt">${escapeHtml(q.card.translation)}</div>
        <input type="text" class="write-input" id="q${i}-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="en español...">
        <div class="answer-key" id="q${i}-key" hidden></div>
      </div>
    `;
  }).join("");

  app.innerHTML = `
    ${blocks}
    <button class="btn-primary" id="btnCheck" style="margin-top:18px;">Comprobar</button>
    <div id="resultBox"></div>
  `;
  document.getElementById("btnCheck").addEventListener("click", gradeExam);
}

function gradeExam(){
  if(checked) return;
  checked = true;
  let correctCount = 0;

  questions.forEach((q, i) => {
    let correct;
    if(q.type === "choice"){
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      const value = selected ? selected.value : null;
      correct = value === q.card.front;
      document.querySelectorAll(`#q${i}-options .opt`).forEach(el => {
        el.querySelector("input").disabled = true;
        if(el.dataset.value === q.card.front) el.classList.add("correct");
        else if(el.dataset.value === value) el.classList.add("incorrect");
      });
    } else {
      const input = document.getElementById(`q${i}-input`);
      correct = checkWrittenAnswer(input.value, q.card.front);
      input.disabled = true;
      input.classList.add(correct ? "correct" : "incorrect");
      if(!correct){
        const key = document.getElementById(`q${i}-key`);
        key.hidden = false;
        key.textContent = `Era: ${q.card.front}`;
      }
    }
    if(correct) correctCount++;
    const prevBox = (progress[q.card.id]||{box:0}).box || 0;
    const entry = computeReviewEntry(prevBox, correct);
    saveProgress(progress, q.card.id, entry);
  });

  document.getElementById("btnCheck").hidden = true;
  document.getElementById("resultBox").innerHTML = `
    <div class="result">
      <div class="score">${correctCount} / ${questions.length}</div>
      <p>respuestas correctas</p>
      <button class="btn-primary" id="btnAgain">Nuevo examen</button>
    </div>
  `;
  document.getElementById("btnAgain").addEventListener("click", () => {
    renderStats();
    renderSetup();
  });
  renderStats();
}

(async function init(){
  [allCards, progress] = await Promise.all([loadCards(), loadProgress()]);
  moduleChoice = loadModuleChoice(allCards);
  renderStats();
  renderSetup();
})();
</script>
</body>
</html>
