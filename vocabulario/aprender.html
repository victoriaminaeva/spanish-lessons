<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aprender — Vocabulario</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Modo de aprendizaje: elección múltiple y luego respuesta escrita, hasta dominar cada palabra de la sesión.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ca; --surface:#ffffff; --surface-2:#cde3e8; --ink:#2d120d;
  --muted:#7a5048; --accent:#6b0b0c; --accent-ink:#fff8ca; --pop:#d9761f;
  --border:#ecd98a; --good:#2f7d4f; --bad:#b3261e;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2d120d; --surface:#3a1a14; --surface-2:#452019; --ink:#fff8ca;
    --muted:#d9c58f; --accent:#ef6b52; --accent-ink:#2d120d; --pop:#f2a544;
    --border:#4a2a1e; --good:#6fcf97; --bad:#f28b82;
  }
}
:root[data-theme="dark"]{
  --bg:#2d120d; --surface:#3a1a14; --surface-2:#452019; --ink:#fff8ca;
  --muted:#d9c58f; --accent:#ef6b52; --accent-ink:#2d120d; --pop:#f2a544; --border:#4a2a1e;
  --good:#6fcf97; --bad:#f28b82;
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans", system-ui, sans-serif; line-height:1.6;
  padding-inline:20px; padding-block:0 60px;
}
.wrap{max-width:520px; margin:0 auto;}
h1{font-family:"Fraunces", Georgia, serif; text-wrap:balance;}
a{color:var(--accent);}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  background:var(--bg); padding-block:14px 10px; margin-bottom:6px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  border-bottom:1px solid var(--border);
}
.topbar a.back{font-size:13px; color:var(--muted); text-decoration:none;}
.stats{font-family:"Space Mono", monospace; font-size:12.5px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap;}
.stats b{color:var(--ink);}
.tabs{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;}
.tab{
  flex:1; min-width:70px; text-align:center; text-decoration:none; font-family:"Space Mono", monospace;
  font-size:11.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase;
  padding:9px 4px; border-radius:10px; border:1px solid var(--border); color:var(--muted);
}
.tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
header{padding-block:20px 8px;}
h1{font-size:clamp(24px,5vw,32px); margin:0 0 6px;}
.lead{color:var(--muted); font-size:14.5px; max-width:56ch; margin:0;}

.panel{
  margin-top:22px; padding:22px; border-radius:16px; background:var(--surface);
  border:1px solid var(--border);
}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
.radiogroup{display:flex; gap:10px; flex-wrap:wrap;}
.radiogroup label{
  display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink);
  background:var(--surface-2); border-radius:999px; padding:8px 14px; cursor:pointer;
}
input[type="number"]{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--ink); font-size:15px;
}
.btn-primary{
  width:100%; padding:13px; border-radius:12px; border:none; margin-top:6px;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:15px; cursor:pointer;
}
.btn-primary:active{transform:scale(.99);}
.hint-small{font-size:12.5px; color:var(--muted); margin-top:4px;}

.progressbar{height:6px; border-radius:999px; background:var(--surface-2); margin-top:18px; overflow:hidden;}
.progressbar > div{height:100%; background:var(--accent); transition:width .25s ease;}

.qcard{
  margin-top:22px; padding:26px 24px; border-radius:18px; background:var(--surface);
  border:1px solid var(--border); box-shadow:0 6px 20px rgba(0,0,0,.08); text-align:center;
}
.qlabel{font-family:"Space Mono", monospace; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--pop);}
.qprompt{font-family:"Fraunces", serif; font-weight:600; font-size:clamp(20px,6vw,26px); margin:10px 0 4px;}
.qexplain{font-size:13px; color:var(--muted); margin-bottom:6px;}

.options{display:grid; gap:10px; margin-top:18px;}
.opt{
  padding:13px 16px; border-radius:12px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink); font-size:15px; cursor:pointer; text-align:left;
}
.opt:active{transform:scale(.99);}
.opt.correct{background:var(--good); color:#fff; border-color:var(--good);}
.opt.incorrect{background:var(--bad); color:#fff; border-color:var(--bad);}

.write-row{display:flex; gap:10px; margin-top:18px;}
.write-row input{
  flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--ink); font-size:16px;
}
.write-row input.correct{border-color:var(--good); background:color-mix(in srgb, var(--good) 15%, var(--bg));}
.write-row input.incorrect{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 15%, var(--bg));}
.feedback{margin-top:12px; font-size:13.5px;}
.feedback.correct{color:var(--good);}
.feedback.incorrect{color:var(--bad);}

.empty{
  margin-top:40px; padding:26px 22px; border-radius:14px; background:var(--surface);
  border:1px solid var(--border); text-align:center; color:var(--muted); font-size:14.5px;
}
.empty b{color:var(--ink);}
footer{margin-top:56px; padding-top:20px; border-top:1px solid var(--border); font-size:13px; color:var(--muted); text-align:center;}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <a class="back" href="../index.html">← Talleres</a>
  <div class="stats" id="stats"></div>
</div>

<div class="tabs">
  <a class="tab" href="index.html">Tarjetas</a>
  <a class="tab active" href="aprender.html">Aprender</a>
  <a class="tab" href="examen.html">Examen</a>
  <a class="tab" href="practica.html">Práctica</a>
</div>

<header>
  <h1>Aprender</h1>
  <p class="lead">Empieza con opciones y, en cuanto aciertes, pasa a escribir la palabra de memoria. Cada palabra debe acertarse dos veces seguidas para superar la sesión.</p>
</header>

<div id="app"></div>

<footer>Vocabulario · modo aprender</footer>
</div>

<script src="shared.js"></script>
<script>
let allCards = [];
let progress = {};
let pool = [];
let streaks = {};
let order = [];
let current = null;
let currentMode = "choice";
let stats = {correct:0, incorrect:0};
let answered = false;

function renderStats(){
  const dueCount = allCards.filter(c => isDue(c, progress)).length;
  const mastered = allCards.filter(c => (progress[c.id]||{}).box === MAX_BOX).length;
  document.getElementById("stats").innerHTML =
    `<span>hoy: <b>${dueCount}</b></span><span>dominadas: <b>${mastered}</b></span><span>total: <b>${allCards.length}</b></span>`;
}

function renderSetup(){
  const dueCount = allCards.filter(c => isDue(c, progress)).length;
  const app = document.getElementById("app");
  if(allCards.length === 0){
    app.innerHTML = `<div class="empty">Todavía no hay palabras en el vocabulario. Envía una palabra o expresión en el chat y se añadirá aquí.</div>`;
    return;
  }
  app.innerHTML = `
    <div class="panel">
      <div class="field">
        <label>¿Qué palabras quieres estudiar?</label>
        <div class="radiogroup">
          <label><input type="radio" name="source" value="due" ${dueCount>0?"checked":""}> A repasar hoy (${dueCount})</label>
          <label><input type="radio" name="source" value="all" ${dueCount===0?"checked":""}> Todas (${allCards.length})</label>
        </div>
      </div>
      <div class="field">
        <label for="count">Cuántas palabras en esta sesión</label>
        <input type="number" id="count" min="1" max="${allCards.length}" value="${Math.min(20, dueCount>0?dueCount:allCards.length)}">
      </div>
      <button class="btn-primary" id="btnStart">Comenzar</button>
      <p class="hint-small">Cada respuesta correcta o incorrecta también actualiza el calendario de repaso de las tarjetas.</p>
    </div>
  `;
  document.getElementById("btnStart").addEventListener("click", () => {
    const source = document.querySelector('input[name="source"]:checked').value;
    const count = Math.max(1, Math.min(allCards.length, parseInt(document.getElementById("count").value, 10) || 20));
    startSession(source, count);
  });
}

function startSession(source, count){
  const base = source === "due" ? allCards.filter(c => isDue(c, progress)) : allCards.slice();
  const chosen = shuffle(base.length ? base : allCards).slice(0, count);
  pool = chosen;
  streaks = {};
  pool.forEach(c => streaks[c.id] = 0);
  stats = {correct:0, incorrect:0};
  order = shuffle(pool.map(c => c.id));
  nextQuestion();
}

function graduatedCount(){
  return pool.filter(c => streaks[c.id] >= 2).length;
}

function nextQuestion(){
  answered = false;
  const remaining = order.filter(id => streaks[id] < 2);
  if(remaining.length === 0){
    renderComplete();
    return;
  }
  const id = remaining[Math.floor(Math.random() * remaining.length)];
  current = pool.find(c => c.id === id);
  currentMode = streaks[id] === 0 ? "choice" : "write";
  renderQuestion();
}

function renderProgress(){
  const total = pool.length;
  const done = graduatedCount();
  return `<div class="progressbar"><div style="width:${total? (done/total*100):0}%"></div></div>
    <p class="hint-small">${done} / ${total} superadas en esta sesión</p>`;
}

function renderQuestion(){
  const app = document.getElementById("app");
  const explainHtml = current.explanation_es ? `<div class="qexplain">${escapeHtml(current.explanation_es)}</div>` : "";

  if(currentMode === "choice"){
    const options = shuffle([current.front, ...pickDistractors(allCards, current.id, 3)]);
    app.innerHTML = `
      ${renderProgress()}
      <div class="qcard">
        <div class="qlabel">¿Cómo se dice...?</div>
        <div class="qprompt">${escapeHtml(current.translation)}</div>
        ${explainHtml}
        <div class="options" id="options">
          ${options.map(o => `<button class="opt" data-value="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join("")}
        </div>
      </div>
    `;
    document.querySelectorAll(".opt").forEach(btn => {
      btn.addEventListener("click", () => handleChoiceAnswer(btn));
    });
  } else {
    app.innerHTML = `
      ${renderProgress()}
      <div class="qcard">
        <div class="qlabel">Escribe la palabra</div>
        <div class="qprompt">${escapeHtml(current.translation)}</div>
        ${explainHtml}
        <div class="write-row">
          <input type="text" id="writeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="en español...">
        </div>
        <button class="btn-primary" id="btnCheck" style="margin-top:14px;">Comprobar</button>
        <div class="feedback" id="feedback"></div>
      </div>
    `;
    const input = document.getElementById("writeInput");
    input.focus();
    const check = () => handleWriteAnswer(input.value);
    document.getElementById("btnCheck").addEventListener("click", check);
    input.addEventListener("keydown", (e) => { if(e.key === "Enter") check(); });
  }
}

function registerAnswer(card, correct){
  const prevBox = (progress[card.id]||{box:0}).box || 0;
  const entry = computeReviewEntry(prevBox, correct);
  saveProgress(progress, card.id, entry);
  if(correct){ streaks[card.id]++; stats.correct++; }
  else { streaks[card.id] = 0; stats.incorrect++; }
}

function handleChoiceAnswer(btn){
  if(answered) return;
  answered = true;
  const correct = btn.dataset.value === current.front;
  document.querySelectorAll(".opt").forEach(o => {
    if(o.dataset.value === current.front) o.classList.add("correct");
    else if(o === btn) o.classList.add("incorrect");
    o.disabled = true;
  });
  registerAnswer(current, correct);
  setTimeout(nextQuestion, correct ? 700 : 1400);
}

function handleWriteAnswer(value){
  if(answered) return;
  answered = true;
  const correct = checkWrittenAnswer(value, current.front);
  const input = document.getElementById("writeInput");
  const feedback = document.getElementById("feedback");
  input.classList.add(correct ? "correct" : "incorrect");
  input.disabled = true;
  document.getElementById("btnCheck").disabled = true;
  feedback.className = "feedback " + (correct ? "correct" : "incorrect");
  feedback.textContent = correct ? "¡Correcto!" : `Era: ${current.front}`;
  registerAnswer(current, correct);
  setTimeout(nextQuestion, correct ? 700 : 1600);
}

function renderComplete(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="empty">
      <b>¡Sesión completada!</b><br>
      ${pool.length} palabras superadas · ${stats.correct} aciertos, ${stats.incorrect} fallos en total.
    </div>
    <button class="btn-primary" id="btnAgain" style="margin-top:16px;">Nueva sesión</button>
  `;
  document.getElementById("btnAgain").addEventListener("click", () => {
    renderStats();
    renderSetup();
  });
  renderStats();
}

(async function init(){
  [allCards, progress] = await Promise.all([loadCards(), loadProgress()]);
  renderStats();
  renderSetup();
})();
</script>
</body>
</html>
